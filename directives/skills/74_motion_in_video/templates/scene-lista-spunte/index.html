<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>A2 — lista con spunte (4.10s)</title>
    <!-- Due card in vetro inclinate in 3D su sfondo nero con luce colorata. Si raddrizzano verso la camera;
         "Business" si accende a ~1.6s, "Enterprise" a ~2.9s, in sync con il parlato. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Brand"; font-weight: 100 900; src: url("fonts/brand.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #01060f; }
      #root { position: absolute; inset: 0; background: #01060f; font-family: "Brand", "Inter", sans-serif; }
      .light { position: absolute; border-radius: 50%; filter: blur(40px); }
      .l1 { left: -120px; top: 520px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(44,111,196,.55), rgba(0,0,0,0) 65%); }
      .l2 { left: 460px; top: 760px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(250,189,0,.22), rgba(0,0,0,0) 65%); }
      .head { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
      .eyebrow { font-size: 40px; font-weight: 600; color: #86868b; letter-spacing: -0.01em; }
      .h { margin-top: 14px; font-size: 104px; font-weight: 700; letter-spacing: -0.035em; color: #f5f5f7; line-height: 1.04; }
      .h span { background: linear-gradient(90deg, #6fa3ea, #fabd00); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .cam { position: absolute; left: 0; right: 0; top: 620px; height: 720px; perspective: 1600px; }
      .stack { position: absolute; left: 110px; right: 110px; top: 40px; height: 640px; transform-style: preserve-3d; }
      .card { position: absolute; left: 0; right: 0; height: 270px; border-radius: 44px; padding: 0 56px;
              display: flex; align-items: center; justify-content: space-between;
              background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
              border: 1.5px solid rgba(255,255,255,.22);
              box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 50px 90px -30px rgba(0,0,0,.9);
              backdrop-filter: blur(24px); }
      .c1 { top: 0; } .c2 { top: 320px; }
      .label { font-size: 30px; font-weight: 600; color: #86868b; letter-spacing: .02em; }
      .plan { margin-top: 0; font-size: 76px; font-weight: 700; letter-spacing: -0.03em; color: #f5f5f7; }
      .tick { position: relative; width: 104px; height: 104px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); }
      .tick .fill { position: absolute; inset: -3px; border-radius: 50%; background: linear-gradient(135deg, #ffd23f, #fabd00); box-shadow: 0 0 40px rgba(250,189,0,.55); }
      .tick svg { position: absolute; left: 24px; top: 24px; width: 56px; height: 56px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.1" data-width="1080" data-height="1920">
      <div class="light l1" id="l1"></div><div class="light l2" id="l2"></div>
      <div class="head clip" data-start="0" data-duration="4.1" data-track-index="1">
        <div class="eyebrow" id="eye">Prodotto</div>
        <div class="h" id="h">Incluso <span>nei</span> piani</div>
      </div>
      <div class="cam clip" data-start="0" data-duration="4.1" data-track-index="2">
        <div class="stack" id="stack">
          <div class="card c1" id="c1"><div><div class="plan">Piano A</div></div>
            <div class="tick"><span class="fill" id="f1"></span><svg viewBox="0 0 24 24"><path id="p1" d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#031026" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div></div>
          <div class="card c2" id="c2"><div><div class="plan">Piano B</div></div>
            <div class="tick"><span class="fill" id="f2"></span><svg viewBox="0 0 24 24"><path id="p2" d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#031026" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div></div>
        </div>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#l1", { x: -80, opacity: 0.4 }, { x: 60, opacity: 1, duration: 4.1, ease: "sine.inOut" }, 0);
        tl.fromTo("#l2", { x: 80, opacity: 0.3 }, { x: -60, opacity: 1, duration: 4.1, ease: "sine.inOut" }, 0);
        tl.fromTo("#eye", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.02);
        tl.fromTo("#h", { opacity: 0, y: 40, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.1);
        // stack arriva inclinato e lontano, poi si raddrizza lentamente per tutto il clip
        tl.fromTo("#stack", { rotationX: 48, rotationY: -26, rotationZ: 8, z: -500, y: 160 },
                            { rotationX: 10, rotationY: -8, rotationZ: 2, z: 0, y: 0, duration: 1.4, ease: "expo.out" }, 0.2);
        tl.to("#stack", { rotationX: 4, rotationY: -2, rotationZ: 0, duration: 2.5, ease: "sine.inOut" }, 1.6);
        tl.fromTo("#c1, #c2", { opacity: 0 }, { opacity: 0.45, duration: 0.5, stagger: 0.1 }, 0.2);
        tl.fromTo("#c2", { z: -120 }, { z: -120, duration: 0.01 }, 0.2);
        tl.fromTo("#f1, #f2", { scale: 0 }, { scale: 0, duration: 0.01 }, 0);
        // business ~1.6s
        tl.to("#c1", { opacity: 1, z: 60, duration: 0.5, ease: "back.out(1.4)" }, 1.5);
        tl.to("#f1", { scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.55);
        tl.to("#p1", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.7);
        // enterprise ~2.9s
        tl.to("#c1", { z: 0, duration: 0.5, ease: "power2.out" }, 2.75);
        tl.to("#c2", { opacity: 1, z: 60, duration: 0.5, ease: "back.out(1.4)" }, 2.8);
        tl.to("#f2", { scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.85);
        tl.to("#p2", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.0);
        tl.to({}, { duration: 0.01 }, 4.09);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
